/* ===============================
ARAMA
================================ */

function norm(s){

return String(s||"")
.toLocaleLowerCase("tr-TR")
.replace(/ı/g,"i")
.replace(/ğ/g,"g")
.replace(/ü/g,"u")
.replace(/ş/g,"s")
.replace(/ö/g,"o")
.replace(/ç/g,"c");

}


function searchLaw(){

let q=norm(
document.getElementById("lawSearch").value
);

if(!q){

document.getElementById("lawBox").innerHTML="";
return;

}

let ids=[];

if(/^\d+$/.test(q)){

let n=Number(q);

if(titles[n])ids.push(n);

}else{

Object.keys(topics).forEach(k=>{

if(norm(k).includes(q)||q.includes(norm(k))){

ids.push(...topics[k]);

}

});

laws.forEach(x=>{

if(
norm(x.title).includes(q) ||
norm(x.title).split(" ").some(w=>w.startsWith(q))
){

ids.push(x.n);

}

});

}

ids=[...new Set(ids)].sort((a,b)=>a-b);

render(ids);

}


function render(ids){

let box=document.getElementById("lawBox");

if(!ids.length){

box.innerHTML=`
<div class="empty">
❌ İlgili madde bulunamadı.
<br><br>
<a class="link"
target="_blank"
href="https://www.csgb.gov.tr/cgm/mevzuat/">
ÇSGB Güncel Mevzuat
</a>
</div>`;
return;

}

box.innerHTML=ids.map(n=>{

let t=titles[n];
let text=texts[n];

return `

<div class="result">

<span class="badge">4857 • MADDE ${n}</span>

<h3>Madde ${n} - ${t}</h3>

<button class="btn"
onclick="openArticle(${n})">
📖 Maddeyi Oku
</button>

<div id="a${n}" class="article">

<strong>MADDE ${n}</strong>

<p>${text||"Bu madde için güncel tam metni resmi ÇSGB mevzuat kaynağından kontrol edebilirsiniz."}</p>

${!text?`

<a class="link"
target="_blank"
href="https://www.csgb.gov.tr/cgm/mevzuat/">
🏛️ ÇSGB Güncel Metin
</a>`:""}

</div>

</div>

`;

}).join("");

}


function openArticle(n){

let el=document.getElementById("a"+n);

if(el)el.classList.toggle("open");

}

</div>

</div>`;

return;

}


/* KISA VE FARKLI CEVAPLAR */

const replies=[

"Bu konuda çalışma süreniz ve işyerindeki uygulama birlikte değerlendirilmelidir.",

"Bu durumda ilgili kanun maddesinin yanında vardiya ve ücret kayıtları da önemlidir.",

"Somut olayın ayrıntıları sonucu değiştirebilir. Aşağıdaki maddeler doğrudan ilgili düzenlemelerdir.",

"Bu konuda işverenin uygulaması ile sözleşme hükümlerinin birlikte incelenmesi gerekir."

];

let reply=
replies[Math.floor(Math.random()*replies.length)];

box.innerHTML=`

<div class="card">

<h3>⚖️ Kısa cevap</h3>

<div class="answer">
${reply}
</div>

<h3>📚 İlgili maddeler</h3>

${ids.map(n=>`

<button class="btn"
onclick="goLaw(${n})">
📖 Madde ${n} - ${titles[n]}
</button>

`).join("")}

<div class="warning">
Aşağıdaki maddeye dokunarak ilgili metni
doğrudan uygulama içinde okuyabilirsiniz.
</div>

</div>

`;

}


function goLaw(n){

document.querySelectorAll(".panel")
.forEach(x=>x.classList.remove("active"));

document.getElementById("kanun")
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

document.querySelectorAll("nav button")[1]
.classList.add("active");

document.getElementById("lawSearch").value=n;

searchLaw();

setTimeout(()=>{
openArticle(n);
},100);

}

function caseSearch(){

let q=document
.getElementById("caseSearch")
.value
.trim();

let box=document.getElementById("caseBox");

if(!q){

box.innerHTML=
`<div class="empty">🔎 Aranacak konuyu yazın.</div>`;

return;

}

let url=
"https://karararama.yargitay.gov.tr/?aranan="
+
encodeURIComponent(q);

box.innerHTML=`

<div class="result">

<span class="badge">
🏛️ YARGITAY
</span>

<h3>${q}</h3>

<p>
Bu arama doğrudan Yargıtay'ın resmi karar
arama sistemine yönlendirilir.
</p>

<a class="link"
target="_blank"
href="${url}">
🏛️ Yargıtay Kararında Ara
</a>

</div>

`;

}
