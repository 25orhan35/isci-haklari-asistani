/* =====================================================
 SEKME
===================================================== */

function tab(id,button){

document.querySelectorAll(".panel")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");
}


/* =====================================================
 TÜRKÇE ARAMA
===================================================== */

function normalize(text){

return String(text || "")
.toLocaleLowerCase("tr-TR")
.replace(/ı/g,"i")
.replace(/ğ/g,"g")
.replace(/ü/g,"u")
.replace(/ş/g,"s")
.replace(/ö/g,"o")
.replace(/ç/g,"c")
.replace(/\s+/g," ")
.trim();
}

/* =====================================================
 KANUN ARAMA
===================================================== */

function searchLaw(){

const q=normalize(
document.getElementById("lawSearch").value
);

const box=document.getElementById("lawResults");

if(!q){
box.innerHTML="";
return;
}

let results=[];

if(/^\d+$/.test(q)){

results=laws.filter(x=>x.n===Number(q));

}else{

const words=q.split(" ");

results=laws.map(x=>{

const text=normalize(
x.n+" "+x.title+" "+x.keys+" "+x.text
);

let score=0;

words.forEach(w=>{
if(text.includes(w))score++;
});

return {...x,score};

})
.filter(x=>x.score>0)
.sort((a,b)=>b.score-a.score);

}

if(!results.length){

box.innerHTML=`
<div class="empty">
🔎 Bu arama için uygulamadaki indeks kayıtlarında sonuç bulunamadı.

<a class="link"
target="_blank"
href="https://www.csgb.gov.tr/cgm/mevzuat/">
ÇSGB Güncel Mevzuat
</a>
</div>`;

return;
}

box.innerHTML=results.map(x=>`

<div class="result">

<span class="badge">4857 • Madde ${x.n}</span>

<h3>Madde ${x.n} - ${x.title}</h3>

<p>${x.text}</p>

<button class="btn"
onclick="toggleArticle('article-${x.n}')">
📖 Maddeyi Aç / Kapat
</button>

<div id="article-${x.n}" class="article">

<strong>Madde ${x.n} - ${x.title}</strong>

<p>${x.text}</p>

<p class="small">
Güncel kanun metninin tamamını Çalışma ve Sosyal
Güvenlik Bakanlığı'nın mevzuat sayfasından
kontrol edebilirsiniz.
</p>

<a class="link"
target="_blank"
href="https://www.csgb.gov.tr/cgm/mevzuat/">
ÇSGB Resmî Mevzuat
</a>

</div>

</div>

`).join("");

}

function answerQuestion(){

const q=normalize(
document.getElementById("question").value
);

const box=document.getElementById("answer");

if(!q){

box.innerHTML=
`<div class="card">⚠️ Önce sorunuzu yazın.</div>`;

return;
}

let found=null;

for(const topic of topics){

if(topic.keys.some(k=>q.includes(normalize(k)))){

found=topic;
break;

}
}

if(!found){

box.innerHTML=`

<div class="card">

<h3>⚖️ Genel değerlendirme</h3>

<div class="answer">
Sorunuzun kesin cevabı olayın ayrıntılarına bağlıdır.
Çalışma süreniz, vardiya düzeniniz, bordronuz,
iş sözleşmeniz ve varsa toplu iş sözleşmeniz
birlikte değerlendirilmelidir.
</div>

</div>`;

return;
}

const response=
found.answers[
Math.floor(Math.random()*found.answers.length)
];

box.innerHTML=`

<div class="card">

<span class="badge">📌 ${found.title}</span>

<h3>⚖️ Kısa cevap</h3>

<div class="answer">
${response}
</div>

<h3>📚 İlgili maddeler</h3>

${found.laws.map(n=>`

<button
class="btn"
onclick="openLaw(${n})">
📖 4857 / Madde ${n}
</button>

`).join("")}

<div class="warning">
Bu cevap genel hukuki bilgilendirme amaçlıdır.
Somut olayda sözleşme, toplu iş sözleşmesi,
işyeri uygulaması ve çalışma kayıtları ayrıca
değerlendirilmelidir.
</div>

</div>

`;

}

function openLaw(number){

const btn=document.querySelectorAll("nav button")[1];

document.getElementById("lawSearch").value=number;

searchLaw();

setTimeout(()=>{

const el=document.getElementById(
"article-"+number
);

if(el)el.classList.add("open");

},80);

}

function searchYargitay(){

const q=
document.getElementById("caseSearch").value.trim();

const box=document.getElementById("caseResults");

if(!q){

box.innerHTML=`
<div class="empty">
Yargıtay'da aranacak konuyu yazın.
</div>`;

return;
}

/*
 Yargıtay'ın resmi karar arama sistemi URL'si
 sorgu parametresiyle güvenilir biçimde sonuç
 üretmediği için kullanıcıyı doğrudan resmi
 arama ekranına gönderiyoruz.
*/

const url=
"https://karararama.yargitay.gov.tr/";

box.innerHTML=`

<div class="result">

<span class="badge">🏛️ Yargıtay Resmî Sistem</span>

<h3>
"${escapeHtml(q)}"
</h3>

<p>
Bu konu için Yargıtay'ın resmî emsal karar
arama ekranını açabilirsiniz.
</p>

<p class="small">
Yargıtay'ın kendi açıklamasına göre emsal kararlar
doküman içeriği, daire, esas numarası, karar
numarası, karar tarihi, kavram ve ilgili mevzuat
alanlarıyla aranabilir.
</p>

<a class="link"
target="_blank"
href="${url}">
🏛️ Yargıtay'da Bu Konuyu Ara
</a>

</div>

`;

}


/* =====================================================
 HTML GÜVENLİĞİ
===================================================== */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
  </html>
