function normal(metin){

return metin
.toLocaleLowerCase("tr-TR")
.replace(/ı/g,"i")
.replace(/ğ/g,"g")
.replace(/ü/g,"u")
.replace(/ş/g,"s")
.replace(/ö/g,"o")
.replace(/ç/g,"c");

}


function puanla(madde,arama){

let puan=0;

const q=normal(arama);

const kelimeler=q
.split(/\s+/)
.filter(x=>x.length>2);


kelimeler.forEach(kelime=>{

if(normal(madde.baslik).includes(kelime)){
puan+=5;
}

if(
madde.anahtar.some(
x=>normal(x).includes(kelime)
)){
puan+=4;
}

if(normal(madde.ozet).includes(kelime)){
puan+=2;
}

});

return puan;

}


function ara(){

const arama=
document.getElementById("arama").value.trim();

const sonuc=
document.getElementById("sonuclar");


if(!arama){

sonuc.innerHTML=`

<div class="sonuc">

<div class="baslik">
📚 Konu arayın
</div>

<div class="konu">
Örneğin: fazla mesai, yıllık izin,
vardiya, hafta tatili, resmi tatil...
</div>

</div>

`;

return;

}


const bulunan=maddeler
.map(madde=>({

...madde,

puan:puanla(madde,arama)

}))

.filter(madde=>madde.puan>0)

.sort((a,b)=>b.puan-a.puan);


if(bulunan.length===0){

sonuc.innerHTML=`

<div class="sonuc">

<div class="baslik">
🔍 İlgili madde bulunamadı
</div>

<div class="konu">
Farklı kelimelerle tekrar deneyin.
</div>

</div>

`;

return;

}


sonuc.innerHTML=bulunan
.map((madde,index)=>`

<div
class="sonuc"
onclick="detayAc(${index})">

<span class="puan">
${index===0 ? "⭐ En alakalı" : "İlgili"}
</span>

<div class="baslik">

Madde ${madde.no} -
${madde.baslik}

</div>

<div class="konu">

${madde.ozet}

</div>


<div
id="detay-${index}"
class="detay">

<h3>
📖 Madde ${madde.no}
</h3>

<h3>
${madde.baslik}
</h3>

<p>
${madde.metin}
</p>

<p>

</p>

<p>
Bu uygulamadaki açıklama yönlendirme

</p>

<a

href="https://www.tbmm.gov.tr/Yasama/Kanun/f72877bd-9f9a-037b-e050-007f01005610"
target="_blank">

📜 TBMM 4857 Sayılı İş Kanunu

</a>

</div>

</div>

`)
.join("");

}

const detay=
document.getElementById("detay-"+index);

if(detay){

detay.classList.toggle("acik");

}

}
