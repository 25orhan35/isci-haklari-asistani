<title>İşçi Hakları Asistanı</title>

color:#64748b;

padding:16px;

💬 Soru-Cevap
</button>

📚 İşçi Kanunu

<button onclick="sekme('yargitay',this)">
🏛️ Yargıtay
</button>

</nav>

<div class="container">

<div class="card">

id="soru"
placeholder="Örneğin: Fazla mesai ücretim ödenmiyor. Hangi kanun maddesi uygulanır?"></textarea>

<button
onclick="soruAra()"
style="width:100%;padding:14px;border:0;border-radius:10px;background:#111827;color:white;font-weight:bold">

Soruyu Ara

</button>

</div>

<div id="cevap"></div>

</section>


<!-- KANUN -->

<section id="kanun" class="panel">

<div class="card">

<h2>📚 4857 Sayılı İş Kanunu</h2>

<input
id="kanunArama"
placeholder="Örn: fazla mesai, yıllık izin, vardiya, pazar, ücret..."
oninput="kanunAra()">

<p class="warning">
Kaynak: T.C. Çalışma ve Sosyal Güvenlik Bakanlığı
Çalışma Genel Müdürlüğü Mevzuatı.
</p>

</div>

<div id="kanunSonuc"></div>

</section>


<!-- YARGITAY -->

<section id="yargitay" class="panel">

<div class="card">

<h2>🏛️ Yargıtay Kararları</h2>

<input
id="yargitayArama"
placeholder="Örn: fazla mesai, yıllık izin, hafta tatili..."

</div>

<div id="yargitaySonuc">

<div class="card">
Yargıtay kararı aramak için konu yazın.
</div>

</div>

</section>

</div>


<script>

/* SEKME */

function sekme(id,button){

document
.querySelectorAll(".panel")
.forEach(x=>x.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

document
.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

}


/* TÜRKÇE ARAMA */

function normal(x){

return (x||"")
.toLocaleLowerCase("tr-TR")
.replace(/ı/g,"i")
.replace(/ğ/g,"g")
.replace(/ü/g,"u")
.replace(/ş/g,"s")
.replace(/ö/g,"o")
.replace(/ç/g,"c");

}

/* KANUN ARAMA */

function kanunAra(){

const q=normal(
document.getElementById("kanunArama").value.trim()
);

const alan=document.getElementById("kanunSonuc");

if(!q){
alan.innerHTML="";
return;
}

const kelimeler=q.split(/\s+/);

let sonuc=maddeler.map(m=>{

let puan=0;

let baslik=normal(m[1]);
let anahtar=normal(m[2]);

kelimeler.forEach(k=>{

if(baslik.includes(k)) puan+=10;

if(anahtar.includes(k)) puan+=5;

});

return {
no:m[0],
baslik:m[1],
anahtar:m[2],
puan
};

})
.filter(x=>x.puan>0)
.sort((a,b)=>b.puan-a.puan);


if(!sonuc.length){

alan.innerHTML=`
<div class="card">
🔍 Bu konuda eşleşen madde bulunamadı.
</div>`;

return;
}


alan.innerHTML=sonuc.map((m,i)=>`

<div class="result"
onclick="maddeAc(${m.no})">

<span class="badge">
${i===0?"⭐ En alakalı":"📚 İlgili madde"}
</span>

<h3>
Madde ${m.no} - ${m.baslik}
</h3>

<div
id="madde${m.no}"
class="detail">

<h2>
📖 Madde ${m.no}
</h2>

<h3>
${m.baslik}
</h3>

<p>
<strong>Madde metnini Bakanlığın güncel
mevzuat kaynağından görüntüleyebilirsiniz.</strong>
</p>

<a
class="source"
href="https://www.csgb.gov.tr/cgm/mevzuat/"
target="_blank">

🏛️ ÇSGB 4857 Sayılı İş Kanunu

</a>

<p class="warning">
Kaynak: T.C. Çalışma ve Sosyal Güvenlik
Bakanlığı, Çalışma Genel Müdürlüğü Mevzuatı.
Bakanlık sayfasında 4857 sayılı İş Kanunu
ve ilgili çalışma mevzuatı yayımlanmaktadır.
</p>

</div>

</div>

`).join("");

}


function maddeAc(no){

const x=document.getElementById("madde"+no);

if(x)
x.classList.toggle("open");

}


/* SORU */

function soruAra(){

const q=normal(
document.getElementById("soru").value
);

const alan=document.getElementById("cevap");

let mesaj="";

if(q.includes("fazla")||q.includes("mesai")){

mesaj=`
<h3>⚖️ Fazla çalışma</h3>

<p>
Sorunuz fazla çalışma ile ilgili görünüyor.
</p>

<p>
📚 Öncelikle <strong>Madde 41</strong>
ve çalışma süresi bakımından
<strong>Madde 63</strong> incelenmelidir.
</p>

<p>
🏛️ Yargıtay bölümünde
<strong>fazla mesai</strong> araması yapabilirsiniz.
</p>
`;

}

else if(q.includes("izin")){

mesaj=`
<h3>📚 Yıllık izin</h3>

<p>
Yıllık izin bakımından
<strong>53-60. maddeler</strong>
özellikle önemlidir.
</p>
`;

}

else if(q.includes("pazar")||q.includes("hafta")){

mesaj=`
<h3>📅 Hafta tatili</h3>

<p>
Hafta tatili bakımından
<strong>Madde 46</strong> incelenmelidir.
</p>
`;

}

else if(q.includes("vardiya")||q.includes("gece")){

mesaj=`
<h3>🌙 Vardiya / gece çalışması</h3>

<p>
Çalışma süresi ve gece çalışması bakımından
<strong>63 ve 69. maddeler</strong> önemlidir.
</p>
`;

}

else{

mesaj=`
<h3>🔎 Konu bulundu</h3>

<p>
Sorunuz için İşçi Kanunu bölümünde
anahtar kelimeyle arama yapın.
</p>
`;

}

alan.innerHTML=`
<div class="card">
<div class="answer">
${mesaj}
</div>
</div>
`;

}


/* YARGITAY */

let kararlar=[];

async function kararYukle(){

try{

const r=
await fetch("yargitay-kararlari.json");

const data=await r.json();

kararlar=data.kararlar||[];

}

catch(e){

console.log(e);

}

}

function yargitayAra(){

const q=normal(
document.getElementById("yargitayArama").value.trim()
);

const alan=document.getElementById("yargitaySonuc");

if(!q){

alan.innerHTML=`
<div class="card">
🏛️ Yargıtay kararlarını aramak için konu yazın.
</div>`;

return;
}

const sonuc=kararlar.map(k=>{

const metin=normal(
JSON.stringify(k)
);

let puan=0;

q.split(/\s+/).forEach(x=>{

if(metin.includes(x))
puan++;

});

return {...k,puan};

})
.filter(k=>k.puan>0)
.sort((a,b)=>b.puan-a.puan);


if(!sonuc.length){

alan.innerHTML=`
<div class="card">
🔍 Bu konuda kayıtlı Yargıtay kararı bulunamadı.
</div>`;

return;
}


alan.innerHTML=sonuc.map(k=>`

<div class="result">

<span class="badge">
🏛️ Yargıtay
</span>

<h3>
${k.daire||""}
</h3>

<p>
<strong>Esas:</strong>
${k.esas_no||""}
</p>

<p>
<strong>Karar:</strong>
${k.karar_no||""}
</p>

<p>
${k.konu||k.ozet||""}
</p>

</div>

`).join("");

}

kararYukle();

</script>
